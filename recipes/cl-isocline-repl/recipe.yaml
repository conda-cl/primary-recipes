package:
  name: cl-isocline-repl
  version: "0.0.0.2026.10.04"

source:
  git: https://github.com/digikar99/cl-isocline
  rev: ac00ef7cae3cc714c46df757bb3808380b3ea71c
  submodules: false

build:
  noarch: generic
  script:
    interpreter: bash
    content: |
      mkdir -p "$PREFIX/bin"
      cat > "$PREFIX/bin/cl-isocline-repl" <<'EOF'
      #!/usr/bin/env bash

      set -euo pipefail
      sbcl --no-sysinit --no-userinit \
        "$@" \
        --eval '(require :asdf)' \
        --eval '(asdf:load-system "isocline-repl")'\
        --eval '(isocline-repl:main)' \
        --eval '(uiop:quit)'
      EOF
      chmod +x "$PREFIX/bin/cl-isocline-repl"

requirements:
  run:
    - sbcl
    - cl-asdf
    - alexandria
    - cl-cffi
    - concrete-syntax-tree
    - eclector
    - styled-strings
    - cl-isocline

tests:
  - script:
      - which cl-isocline-repl

about:
  repository: https://github.com/digikar99/cl-isocline
  homepage: https://github.com/digikar99/cl-isocline/blob/main/README.md
  license: MIT
  summary: MIT licensed Multiline REPL for Common Lisp
  description: |
    `isocline-repl` is a feature-rich Common Lisp REPL with support for:

      -   multiline editing
      -   history
      -   syntax highlighting
      -   basic debugging

      [Isocline](https://github.com/daanx/isocline) is an alternative to libreadline, libedit and the likes. In contrast to the contagious GPL-licensed libreadline, it is

      - MIT licensed
      - Pure C
      - Portable across Unix, Windows, MacOS
      - Supports multiline editing out of the box
      - ... and much more ...
