package:
  name: dissect
  version: "0.0.0.2026.10.05"

source:
  git: https://codeberg.org/shinmera/dissect
  rev: 05972c0ae65407e8c71e06ab0a14e2b57a359796
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/dissect"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - cl-asdf

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "dissect")'
          --eval '(asdf:test-system "dissect")'
    requirements:
      run:
        - sbcl

about:
  repository: https://codeberg.org/shinmera/dissect
  documentation: https://shinmera.com/docs/dissect
  license: Zlib
  summary: Common Lisp introspection library for the call stack and restarts
  description: |
    Dissect is a small library for introspecting the call stack and active restarts.

    See the [documentation](https://shinmera.com/docs/dissect) for more details.
