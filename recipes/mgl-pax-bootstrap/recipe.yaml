package:
  name: mgl-pax-bootstrap
  version: "0.0.0.2026.10.13"

source:
  git: https://github.com/melisgl/mgl-pax
  rev: 943995e5e374902af468c12ae66b808a8c9ec699
  submodules: false

build:
  noarch: generic
  script: build.sh

requirements:
  run:
    - cl-asdf

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "mgl-pax-bootstrap")'
    requirements:
      run:
        - sbcl

about:
  repository: https://github.com/melisgl/mgl-pax
  license: MIT
  summary: Bootstrap system extracted out of mgl-pax 
  description: |
    Use mgl-pax. This system is not for public consumption but solely for
    systems on which PAX depends and which also use PAX
