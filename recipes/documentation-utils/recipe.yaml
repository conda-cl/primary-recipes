package:
  name: documentation-utils
  version: "0.0.0.2025.08.21"

source:
  git: https://codeberg.org/shinmera/documentation-utils.git
  rev: cd5b506c7aa555dea0cc0785f36256348c9e839d
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/documentation-utils"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - sbcl
    - cl-asdf
    - trivial-indent

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "documentation-utils")'
          --eval '(asdf:test-system "documentation-utils")'

about:
  repository: https://codeberg.org/shinmera/documentation-utils.git
  documentation: https://shinmera.com/docs/documentation-utils/
  license: Zlib
  summary:  A few simple tools to help you with documenting your common lisp library.
  description: |
    This is a small library to help you with managing the docstrings for your library.

    See [documentation](https://shinmera.com/docs/documentation-utils/) for more details.
