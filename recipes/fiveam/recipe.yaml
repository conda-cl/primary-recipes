package:
  name: fiveam
  version: "1.4.3"

source:
  git: https://github.com/lispci/fiveam
  rev: 458c62a10358d2a17a5d7ac6c3935d1697eb29a2
  submodules: false

build:
  number: 1
  noarch: generic
  script: build.sh

requirements:
  run:
    - cl-asdf
    - alexandria
    - net.didierverna.asdf-flv
    - trivial-backtrace

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "fiveam/test")'
          --eval '(asdf:test-system "fiveam")'
    requirements:
      run:
        - sbcl

about:
  repository: https://github.com/lispci/fiveam
  homepage: https://fiveam.common-lisp.dev/
  license: BSD-3-Clause
  documentation: https://fiveam.common-lisp.dev/docs/index.html
  summary: Common Lisp regression testing framework
  description: |
    FiveAM is a simple (as far as writing and running tests goes) regression
    testing framework. It has been designed with Common Lisp's interactive
    development model in mind.  Features

      - Test and test suite hierarchies allow test to be organized into hierarchies to ease running.
      - Functions for re-running recently run tests.
      - Inter-test dependencies.
      - Specification based testing ala QuickCheck.
      - Redefined macros are instantly seen by the test code, no explicit recompilation
    required. (this is exactly what LispUnit and FReT do)
