package:
  name: assoc-utils
  version: "0.0.0.2024.10.05"

source:
  git: https://github.com/fukamachi/assoc-utils
  rev: b14ab685231ebd924fc84ffd6099b2819ebcb7c7
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/assoc-utils"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - cl-asdf

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "assoc-utils")'
          --eval '(asdf:test-system "assoc-utils")'
    requirements:
      run:
        - sbcl
        - cl-rove

about:
  repository: https://github.com/fukamachi/assoc-utils
  documentation: https://github.com/fukamachi/assoc-utils/blob/master/README.markdown
  license: Unlicense
  summary: Utilities for manipulating association lists in Common Lisp.
  description: |
    API:

      - aget
      - alist-get
      - with-keys
      - remove-from-alist
      - delete-from-alist
      - alist-plist
      - plist-alist
      - alist-hash
      - hash-alist
      - alist-keys
      - alist-values
      - alistp
      - alist=

    See the [documentation](https://github.com/fukamachi/assoc-utils/blob/master/README.markdown) for more details.
