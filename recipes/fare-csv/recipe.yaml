package:
  name: fare-csv
  version: "0.0.0.2024.09.16"

source:
  git: https://gitlab.common-lisp.net/frideau/fare-csv
  rev: 3ea856ba917a75469cf9fb644b06b80e2a0a82c4
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/fare-csv"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - cl-asdf

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "fare-csv")'
          --eval '(asdf:test-system "fare-csv")'
    requirements:
      run:
        - sbcl
        - hu.dwim.stefil

about:
  repository: https://gitlab.common-lisp.net/frideau/fare-csv
  documentation: https://gitlab.common-lisp.net/frideau/fare-csv/-/blob/master/README.md
  license: MIT
  summary: Common Lisp CSV reader/writer library
  description: |
    This library allows you to read and write CSV files, according to any of the prevailing "standards" and their popular variants.

    **Example Usage**

    ```lisp
    (ql:quickload :fare-csv)
    (fare-csv:with-rfc4180-csv-syntax ()
      (let ((fare-csv:*separator* #\;))
      (fare-csv:read-csv-file "/tmp/semicolon-separated.csv")))
    ```

    See the [documentation](https://gitlab.common-lisp.net/frideau/fare-csv/-/blob/master/README.md) for more details.
