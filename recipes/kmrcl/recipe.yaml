package:
  name: kmrcl
  version: "0.0.0.2013.10.28"

source:
  git: https://github.com/plops/kmrcl
  rev: edef817e4ca48395f6e943210b6b9ffaff5bd669
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/kmrcl"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - cl-asdf

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "kmrcl")'
          # --eval '(asdf:test-system "kmrcl")'
    requirements:
      run:
        - sbcl < 1.2.15

about:
  repository: https://github.com/plops/kmrcl
  license: LicenseRef-LLGPL
  license_file: LICENSE
  summary: kevin rosenbergs code from http://git.b9.com/?p=kmrcl.git;a=summary
  description: |
    KMRCL is a collection of utility functions. It is used as a base for
    some of Kevin M. Rosenberg's Common Lisp packages.

    The web site for KMRCL is http://files.b9.com/kmrcl/
