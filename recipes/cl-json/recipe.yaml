package:
  name: cl-json
  version: "0.0.0.2022.05.03"

source:
  git: https://github.com/sharplispers/cl-json
  rev: 994dd38c94344383f39f95d75987f6dc47a0cca1
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/cl-json"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - cl-asdf

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "cl-json")'
          --eval '(asdf:test-system "cl-json")'
    requirements:
      run:
        - sbcl
        - fiveam

about:
  repository: https://github.com/sharplispers/cl-json
  documentation: https://cl-json.common-lisp.dev/cl-json.html
  license: MIT
  summary: JSON encoder and decoder for Common-Lisp
  description: |
    CL-JSON provides an encoder of Lisp objects to JSON format and a corresponding decoder of JSON data to Lisp objects. Both the encoder and the decoder are highly customizable; at the same time, the default settings ensure a very simple mode of operation, similar to that provided by YASON or ST-JSON. CL-JSON is well tested and the automated testcases includes the JSON_checker tests.

    See the [documentation](https://cl-json.common-lisp.dev/cl-json.html) for more information.
