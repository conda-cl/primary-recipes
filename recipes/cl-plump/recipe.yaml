package:
  name: cl-plump
  version: "0.0.0.2026.04.17"

source:
  git: https://codeberg.org/shinmera/plump
  rev: 45fb7ffd35640d02f54104d568b42a280ffe205c
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/plump"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - cl-asdf
    - cl-array-utils
    - documentation-utils

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "plump")'
          --eval '(asdf:test-system "plump")'
    requirements:
      run:
        - sbcl

about:
  repository: https://codeberg.org/shinmera/plump
  documentation: https://shinmera.com/docs/plump
  license: Zlib
  summary: Practically Lenient and Unimpressive Markup Parser for Common Lisp.
  description: |
    Plump is a parser for HTML/XML like documents, focusing on being lenient towards invalid markup. It can handle things like invalid attributes, bad closing tag order, unencoded entities, inexistent tag types, self-closing tags and so on. It parses documents to a class representation and offers a small set of DOM functions to manipulate it. You are free to change it to parse to your own classes though.

    See the [documentation](https://shinmera.com/docs/plump) for more details.
