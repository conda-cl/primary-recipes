package:
  name: iterate
  version: "1.6.0"

source:
  git: https://gitlab.common-lisp.net/iterate/iterate.git
  rev: d27d7ff4821b9d8b011afaaa866d7993942430f4
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/iterate"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - cl-asdf

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "iterate")'
          --eval '(asdf:test-system "iterate")'
    requirements:
      run:
        - sbcl
        - cl-rt

about:
  repository: https://gitlab.common-lisp.net/iterate/iterate.git
  homepage: https://iterate.common-lisp.dev/
  documentation: https://iterate.common-lisp.dev/doc/index.html
  license: MIT
  summary: iterate, a powerful extensible iteration facility for Common Lisp
  description: |
    iterate is an iteration construct for Common Lisp. It is similar to the CL:LOOP macro, with these distinguishing marks:

    - it is extensible,
    - it helps editors like Emacs indent iterate forms by having a more lisp-like syntax, and
    - it isn't part of the ANSI standard for Common Lisp (which is sometimes a bad thing and sometimes good).
