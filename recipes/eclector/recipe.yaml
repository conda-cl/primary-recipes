package:
  name: eclector
  version: "0.12.0"

source:
  git: https://github.com/s-expressionists/Eclector
  rev: 1ff73bc0784b43be21baa56b81345eaff3002cc2
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/eclector"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - cl-asdf
    - alexandria
    - closer-mop
    - concrete-syntax-tree >=0.3.0

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "eclector")'
          --eval '(asdf:load-system "eclector-concrete-syntax-tree")'
          --eval '(asdf:load-system "eclector.syntax-extensions")'
          --eval '(asdf:test-system "eclector")'
          --eval '(asdf:test-system "eclector-concrete-syntax-tree")'
    requirements:
      run:
        - sbcl
        - fiveam

about:
  repository: https://github.com/s-expressionists/Eclector
  documentation: https://s-expressionists.github.io/Eclector/eclector.html
  license: BSD-2-Clause
  summary: A portable Common Lisp reader that is highly customizable, can recover from errors and can return concrete syntax trees.
  description: |
    The eclector system provides a portable implementation of a reader following the Common Lisp specification.

    eclector is under active development. Its ASDF system structure, package structure, exported symbols and protocols may change at any time but are becoming less and less likely to do so in incompatible ways. Consult the NEWS file or the "Changelog" section of the manual for lists of changes in specific versions.

    This document only gives a very brief overview and highlights some features. Proper documentation can be found in the documentation directory or [here](https://s-expressionists.github.io/Eclector/eclector.html).

