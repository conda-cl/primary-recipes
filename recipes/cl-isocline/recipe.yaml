package:
  name: cl-isocline
  version: "0.0.0.2026.10.04"

source:
  git: https://github.com/digikar99/cl-isocline
  rev: ac00ef7cae3cc714c46df757bb3808380b3ea71c
  submodules: false

build:
  number: 1
  script: build.sh

requirements:
  host:
    - if: win
      then:
        - m2-base
        - gcc_win-64
      else:
        - ${{ compiler('c') }}
  run:
    - cl-asdf
    - alexandria
    - cl-cffi
  ignore_run_exports:
    by_name:
      - libgcc

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval "(require :asdf)"
          --eval "(asdf:load-system \"isocline\")"
    requirements:
      run:
        - sbcl

about:
  repository: https://github.com/digikar99/cl-isocline
  homepage: https://github.com/digikar99/cl-isocline/blob/main/README.md
  license: MIT
  summary: Foreign function bindings to isocline for Common Lisp
  description: |
    [Isocline](https://github.com/daanx/isocline) is an alternative to libreadline, libedit and the likes. In contrast to the contagious GPL-licensed libreadline, it is

      - MIT licensed
      - Pure C
      - Portable across Unix, Windows, MacOS
      - Supports multiline editing out of the box
      - ... and much more ...

    This means it works as an awesome portable repl for Common Lisp, across operating systems and lisp implementations. If you want to supply a portable rich REPL for your Common Lisp application, this repository might just be your thing!

    See [the README](https://github.com/digikar99/cl-isocline/blob/main/README.md) for more details.
