package:
  name: kebab
  version: "0.0.0.2015.06.07"

source:
  git: https://github.com/pocket7878/kebab
  rev: e7f77644c4e46131e7b8039d191d35fe6211f31b
  submodules: false

build:
  noarch: generic
  script:
    - DEST="$PREFIX/common-lisp/kebab"
    - mkdir -p "$DEST"
    - cp -r . "$DEST/"
    - rm -rf "$DEST/.git"

requirements:
  run:
    - cl-asdf
    - cl-interpol
    - alexandria
    - split-sequence

tests:
  - script:
      - sbcl --no-userinit --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-system "kebab")'
          --eval '(asdf:test-system "kebab")'
    requirements:
      run:
        - sbcl
        - cl-prove

about:
  repository: https://github.com/pocket7878/kebab
  documentation: https://github.com/pocket7878/kebab/blob/master/README.markdown
  license: LicenseRef-LLGPL
  license_file: LICENSE
  summary: Common Lisp string,symbol,keyword PascalCase <=> camelCase <=> snake_case <=> kebab-case(lisp-case) converter.
  description: |
    Common Lisp string,symbol,keyword PascalCase <=> camelCase <=> snake_case <=> kebab-case(lisp-case) converter.

    API

    - to-camel-case
    - to-snake-case
    - to-pascal-case
    - to-kebab-case
    - to-lisp-case

